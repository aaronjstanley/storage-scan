name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Create production env
        run: |
          URL="${{ secrets.SUPABASE_URL }}"
          KEY="${{ secrets.SUPABASE_PUBLISHABLE_KEY }}"
          if [ -z "$URL" ]; then
            URL="https://ltryvlcrnjdfjyqcufgq.supabase.co"
          fi
          if [ -z "$KEY" ]; then
            KEY="$(grep '^VITE_SUPABASE_ANON_KEY=' .env.example | cut -d= -f2-)"
          fi
          if [ -z "$KEY" ] || [ "$KEY" = "your-anon-or-publishable-key" ]; then
            echo "Missing Supabase publishable key (set secret SUPABASE_PUBLISHABLE_KEY)"
            exit 1
          fi
          printf 'VITE_SUPABASE_URL=%s\nVITE_SUPABASE_ANON_KEY=%s\n' "$URL" "$KEY" > .env.production
          echo "Using Supabase URL: $URL"

      - run: npm run build

      - name: Verify Supabase config in bundle
        run: grep -q 'ltryvlcrnjdfjyqcufgq' dist/assets/index-*.js

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
